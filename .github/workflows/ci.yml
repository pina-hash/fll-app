name: CI

# One job checks a commit: `npm run check` (svelte-check, baseline 0 errors and
# 0 warnings), `npm test` (the whole vitest suite, database tests included),
# and `npm run history:verify` (the docs/history/ split is still lossless).
#
# THE DATABASE TESTS RUN AGAINST A REAL LOCAL SUPABASE STACK, booted on the
# runner by `supabase start`, exactly the way the local stack in CLAUDE.md is
# booted: the same pinned CLI (2.115.0), the same migration chain applied in
# order, the same `seed.sql`. This is choice (a) of the two the conformance
# prompt offered, and it is the only one this suite admits: the claims in
# tests/ are about GoTrue (a bcrypt hash written from SQL signs in), PostgREST
# (a column with no grant is refused with 42501), Realtime and Storage, and an
# embedded Postgres (idea-app's tests/db/) can confirm none of them
# (tests/db/harness.ts says so in its header). No secret is involved: the
# stack answers on 127.0.0.1 with the well-known demo keys `.env.test` carries,
# and the hosted project is never contacted. `tests/db/linked.ts` reads
# `.env`, which does not exist here, and SKIPS LOUDLY on stderr rather than
# passing.
#
# `schedule` and `workflow_dispatch` are for `integration`. A push made by
# integrate.yml with GITHUB_TOKEN starts no workflow, so `integration` never
# gets a CI run of its own from a push. The nightly job below DISPATCHES this
# workflow on `integration` (workflow_dispatch is the one event GITHUB_TOKEN
# is allowed to trigger), which gives that branch a real run, keyed on its
# own tip sha, that deploy.yml can then read. Press "Run workflow" with the
# branch set to `integration` for the same result on demand.

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    # 04:30 UTC daily, which is 21:30 the evening before in America/Los_Angeles
    # (the season's timezone, CLAUDE.md), so the result is waiting on a
    # Friday morning before the 4:30 session.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vite.config.ts pins the Vercel adapter's runtime to nodejs22.x, and
      # adapter-vercel refuses a Node major it does not know. 22 is what the
      # deploy runs on, so it is what CI runs on.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # The same CLI version CLAUDE.md pins for the Windows and WSL installs,
      # so the runner applies the chain with the same tool a mentor does.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # `-x` leaves out the four services no test reaches (the Studio UI, the
      # Logflare analytics collector, the Vector log shipper and the edge
      # runtime). Everything a test talks to -- Postgres, GoTrue, PostgREST,
      # Realtime, Storage, Kong, postgres-meta, Mailpit -- is started. The
      # chain and `seed.sql` are applied exactly as `supabase start` applies
      # them locally. The boot time is printed so the next reader of this file
      # can compare it against the five-minute budget the choice was made on.
      - name: Start the local Supabase stack
        id: stack
        continue-on-error: true
        run: |
          t0=$(date +%s)
          supabase start -x studio,logflare,vector,edge-runtime
          echo "stack booted in $(( $(date +%s) - t0 ))s"

      # The three steps below run even if an earlier one fails, so one push
      # reports every failure rather than only the first.
      #
      # PLACEHOLDER VALUES, COMMITTED HERE ON PURPOSE -- never a real
      # credential.
      #
      # `npm run check` runs `svelte-kit sync` before svelte-check, and sync
      # GENERATES `$env/static/public` from whatever PUBLIC_-prefixed names are
      # in process.env at that moment. It does not read their VALUES, only
      # their PRESENCE: src/routes/+layout.ts, src/hooks.server.ts and
      # src/lib/server/service-client.ts import PUBLIC_SUPABASE_URL and
      # PUBLIC_SUPABASE_ANON_KEY by name, and with neither set the generated
      # module declares nothing, which is a type error at all three import
      # sites. A fake URL and a fake key satisfy the type checker exactly as
      # well as real ones. `npm ci` runs `prepare`, which syncs before this
      # step's env exists and therefore writes the empty module; this step's
      # own sync regenerates it from the two names below, measured in both
      # directions.
      #
      # THE STEP SCOPE IS LOAD BEARING, NOT TIDINESS, and the sentence that
      # used to stand here -- that the test suite does not read these two --
      # was the defect. It reads EXACTLY these two: tests/db/harness.ts calls
      # required('PUBLIC_SUPABASE_URL') and
      # required('PUBLIC_SUPABASE_ANON_KEY') and points every client at them.
      # vitest.config.ts supplies them from `.env.test` through dotenv's
      # `config()`, WHICH DOES NOT REPLACE A NAME process.env ALREADY CARRIES.
      # While these placeholders sat in a workflow-level `env:` block the test
      # step inherited them, dotenv skipped those two lines of `.env.test`, and
      # the db project aimed at a hostname that does not resolve: 30 of 48
      # files red on `fetch failed`, every one downstream of `signIn`, against
      # a stack that had booted, applied all 25 migrations and seeded.
      # Measured rather than reasoned: with the name preset, dotenv reports
      # "injected env (3)" and the preset value stands; with it unset,
      # "injected env (4)" and 127.0.0.1:54321. Setting them here, on the one
      # step that needs them, is what keeps those two answers apart. The Test
      # suite step below fails loudly if they ever come back.
      - name: Type and a11y check
        id: check
        if: always()
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
        run: npm run check

      # The WHOLE suite: the `pure` project (unit tests over src/lib with no
      # Supabase client) and the `db` project (everything that needs the
      # stack), in one command, files serialised because they share one
      # database (vitest.config.ts). `npm test -- --project pure` is the
      # no-stack subset for a machine without Docker.
      - name: Test suite
        id: test
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          # THE GUARD, NOT A COURTESY. dotenv's `config()` in vitest.config.ts
          # will not replace a name process.env already carries, so anything
          # that sets these two for this step silently re-points every database
          # test away from the local stack, and the failure surfaces as
          # `fetch failed` inside `signIn` in tests/db/harness.ts rather than
          # as the configuration mistake it is. Refuse here, where the message
          # can name it.
          if [ -n "${PUBLIC_SUPABASE_URL:-}" ] || [ -n "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::PUBLIC_SUPABASE_URL or PUBLIC_SUPABASE_ANON_KEY is set in this step's environment. The suite reads exactly these two names (tests/db/harness.ts) and vitest.config.ts fills them from .env.test with dotenv, which does not replace a name already in process.env: the database tests would run against that value instead of the local stack and fail as 'fetch failed' in signIn. Scope those placeholders to the step that needs them, the way the Type and a11y check step above does. Do not set them for the whole workflow."
            exit 1
          fi
          npm test

      # `npm run history:verify` (docs/history/_tools/verify-split.mjs)
      # reassembles the 27 pre-split docs/history/record-*.md files and
      # compares a sha256 of the result against the pinned pre-split body. It
      # also tries a byte compare through `git show` against the pre-split
      # commit, but this checkout is shallow so that leg is normally
      # unavailable here and the script falls back to the sha256 alone. The
      # only way this step goes red is a genuinely malformed or drifted entry.
      - name: History record check
        id: history-verify
        if: always()
        continue-on-error: true
        run: npm run history:verify

      - name: Fail the job if any step failed
        if: always()
        run: |
          echo "stack:          ${{ steps.stack.outcome }}"
          echo "check:          ${{ steps.check.outcome }}"
          echo "test:           ${{ steps.test.outcome }}"
          echo "history-verify: ${{ steps.history-verify.outcome }}"
          if [ "${{ steps.stack.outcome }}" != "success" ] || [ "${{ steps.check.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ] || [ "${{ steps.history-verify.outcome }}" != "success" ]; then
            exit 1
          fi

  # The nightly run of `integration`. A `schedule` event always runs on the
  # default branch, so this job cannot test `integration` itself; it dispatches
  # a run ON that branch instead, which is the shape deploy.yml reads (a
  # completed run whose head_sha is integration's tip). If `integration` does
  # not exist yet nothing is dispatched and the job says so.
  nightly-integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch CI on integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin integration >/dev/null; then
            gh workflow run ci.yml --ref integration
            echo "::notice::dispatched CI on integration"
          else
            echo "::notice::integration does not exist yet; nothing to test"
          fi
